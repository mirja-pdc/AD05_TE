spring.application.name=ad05_te01
server.address=127.0.0.1
server.port=8083

# Conexión al servicio PDB de Oracle XE 21c (evita CDB$ROOT y usa tu usuario de prácticas, no SYSTEM)
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@//localhost:1521/XEPDB1}
spring.datasource.username=${DB_USER:AD05_APP}
spring.datasource.password=${DB_PASSWORD}

# Crea/actualiza tablas y secuencias en prácticas; desactiva OSIV y scripts SQL automáticos
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.sql.init.mode=never

# Útil en desarrollo para ver el SQL que genera Hibernate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.thymeleaf.cache=false
